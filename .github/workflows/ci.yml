# documentation.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Pub dependencies
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.os }}/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.4

      - name: Install dependencies
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate translation files
        run: |
          echo "=== Validating ARB files ==="
          for locale in pt_BR; do
            echo "Checking $locale..."
            dart run scripts/maintain_translations.dart --locale=$locale --extract-untranslated --dry-run
            if [ $? -ne 0 ]; then
              echo "FAIL: Translation maintenance needed for $locale"
              echo "Run: dart run scripts/maintain_translations.dart --locale=$locale --extract-untranslated"
              exit 1
            fi
            echo "  OK: $locale"
          done
          echo ""
          echo "=== Validating no duplicates ==="
          dart run scripts/clean_arb_duplicates.dart
          echo ""
          echo "=== All validations passed ==="

      - name: Send to web
        run: flutter build web --release --base-href /lcs-new-age/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
